[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcsim"
version = "0.1.0"
description = "Monte Carlo particle simulation for FCC physics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "rich>=13.0",
    "pandas>=2.0",
]

[project.scripts]
mcsim = "mcsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
